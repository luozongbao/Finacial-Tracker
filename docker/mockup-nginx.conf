# docker/mockup-nginx.conf — static server for the UX/UI mockups.
#
# Serves docs/mockup/*.html on http://localhost:${MOCKUP_PORT:-8089}/.
#
# This is a DOCUMENTATION VIEWER ONLY:
#   - no PHP, no database, no application code,
#   - no access to any part of the repository except docs/mockup/,
#   - everything is mounted read-only.
#
# It is deliberately separate from the application container so that browsing
# a mockup can never execute application code, and so that the mockups stay
# browsable while the app stack is stopped.
#
# See docs/issues/issue-002.md.

server {
    listen      80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset     utf-8;
    server_tokens off;

    # ---- Health endpoint (used by the compose healthcheck) --------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- The mockups themselves ------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Never expose dotfiles -------------------------------------------
    # .git, .htaccess, editor swap files.
    location ~ /\. {
        return 404;
    }

    # ---- Never expose generator sources or scratch output -----------------
    # The mockups may be generated by a script; its source and its build
    # directory must not be downloadable.
    location ~* ^/_build/ {
        return 404;
    }
    location ~* \.(?:php|sh|bash|py|pyc|pyo|bak|swp|tmp|log|sql|ini|env)$ {
        return 404;
    }

    # ---- Static asset caching --------------------------------------------
    location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|ico|woff2?|ttf)$ {
        expires 1h;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Baseline security headers ---------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
